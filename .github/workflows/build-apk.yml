name: Build Ddddd APK

on:
  push:
    branches: [main]
    paths:
      - 'Ddddd-1.0.0-Beta-source.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Extract source archive
        run: unzip -q Ddddd-1.0.0-Beta-source.zip -d .
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: Ddddd
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ddddd-1.0.0-Beta
          path: Ddddd/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
