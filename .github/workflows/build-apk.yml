name: Build Ddddd APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Extract source archive
        run: unzip -q Ddddd-1.0.0-Beta-source.zip -d .
      - name: Remove update-check feature
        working-directory: Ddddd
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/java/com/killsuoji/app/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          for name in ("fetchLatestUpdate", "UpdateCard"):
              pos = s.find("fun " + name)
              if pos < 0:
                  continue
              start = s.rfind(chr(10), 0, pos) + 1
              brace = s.find("{", pos)
              depth = 0
              end = None
              for i in range(brace, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit("Cannot remove " + name)
              s = s[:start] + s[end:]
          s = s.replace("        item { UpdateCard() }" + chr(10), "")
          for imp in ("import android.app.DownloadManager", "import android.net.Uri", "import android.os.Environment", "import android.provider.Settings", "import java.net.URL"):
              s = s.replace(imp + chr(10), "")
          p.write_text(s, encoding="utf-8")
          if "UpdateCard" in s or "fetchLatestUpdate" in s:
              raise SystemExit("Update feature removal verification failed")
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: Ddddd
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0-beta-no-update Ddddd/app/build/outputs/apk/debug/app-debug.apk \
            --title "Ddddd 1.0.0 Beta (No Update Checker)" \
            --notes "Build with update-check and in-app APK update functionality removed."
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ddddd-1.0.0-Beta-no-update
          path: Ddddd/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
