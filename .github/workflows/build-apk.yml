name: Build Ddddd APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Remove update-check feature
        working-directory: Ddddd
        shell: python
        run: |
          from pathlib import Path
          p = Path("app/src/main/java/com/killsuoji/app/MainActivity.kt")
          s = p.read_text(encoding="utf-8")
          for name in ("fetchLatestUpdate", "UpdateCard"):
              pos = s.find("fun " + name)
              if pos < 0:
                  continue
              start = s.rfind(chr(10), 0, pos) + 1
              previous = s[:start].rstrip()
              if previous.endswith("@Composable"):
                  start = s.rfind("@Composable", 0, start)
              brace = s.find("{", pos)
              depth = 0
              end = None
              for i in range(brace, len(s)):
                  if s[i] == "{":
                      depth += 1
                  elif s[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit("Cannot remove " + name)
              s = s[:start] + s[end:]
          s = s.replace("        item { UpdateCard() }" + chr(10), "")
          for imp in ("import android.app.DownloadManager", "import android.net.Uri", "import android.os.Environment", "import android.provider.Settings", "import java.net.URL"):
              s = s.replace(imp + chr(10), "")
          p.write_text(s, encoding="utf-8")
          if "UpdateCard" in s or "fetchLatestUpdate" in s:
              raise SystemExit("Update feature removal verification failed")

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Missing one or more signing secrets."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ddddd-release.jks"
          chmod 600 "$RUNNER_TEMP/ddddd-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/ddddd-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "KILLSUOJI_KEYSTORE_FILE=$RUNNER_TEMP/ddddd-release.jks" >> "$GITHUB_ENV"
          echo "KILLSUOJI_STORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KILLSUOJI_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KILLSUOJI_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed APK
        working-directory: Ddddd
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p release
          cp Ddddd/app/build/outputs/apk/debug/app-debug.apk "release/1.1.0 beta.apk"

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.1.0-beta "release/1.1.0 beta.apk" \
            --title "Ddddd 1.1.0 Beta" \
            --notes "Ddddd 1.1.0 Beta. Signed with the persistent Ddddd release key. Existing 1.0.0 Beta installs must be replaced once because their signing certificate is different."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: 1.1.0-beta
          path: release/1.1.0 beta.apk
          if-no-files-found: error
          retention-days: 30
