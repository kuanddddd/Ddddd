name: Build SukiSU Ultra Manager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sukisu-manager.yml'

permissions:
  contents: write

jobs:
  build-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ddddd and SukiSU Ultra source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --channel=3 "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/.android/sdk}}"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ddddd-release.jks"
          chmod 600 "$RUNNER_TEMP/ddddd-release.jks"

      - name: Set manager version
        working-directory: vendor/SukiSU-Ultra/manager
        run: |
          echo "Building SukiSU Ultra Manager 9.9.9 beta"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          old = 'fun getVersionName(): String {\n    return getGitDescribe()\n}'
          new = 'fun getVersionName(): String {\n    return "9.9.9 beta"\n}'
          if old not in s:
              raise SystemExit("Cannot find upstream manager version function; refusing an unsafe edit")
          s = s.replace(old, new, 1)
          # Keep upstream Android SDK 37 settings; install preview packages from the canary channel.
          p.write_text(s, encoding="utf-8")
          PY

      - name: Build SukiSU Ultra Manager APK
        working-directory: vendor/SukiSU-Ultra/manager
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: ${{ runner.temp }}/ddddd-release.jks
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug -PIS_PR_BUILD=false -PKSU_PACKAGE_NAME=com.lcsnb7878.ddddd -PKSU_NAME=Ddddd

      - name: Prepare direct APK release asset
        run: |
          mkdir -p dist
          APK="$(find vendor/SukiSU-Ultra/manager/app/build/outputs/apk/debug -maxdepth 1 -type f -name "*.apk" -print -quit)"
          test -n "$APK" && test -s "$APK"
          cp "$APK" "dist/Ddddd-9.9.9-beta.apk"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging "dist/Ddddd-9.9.9-beta.apk" | grep -F "package: name='com.lcsnb7878.ddddd'"

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sukisu-manager-9.9.9-beta
          name: Ddddd 9.9.9 Beta
          prerelease: true
          draft: false
          overwrite_files: true
          files: dist/Ddddd-9.9.9-beta.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
