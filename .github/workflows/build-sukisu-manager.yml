name: Build SukiSU Ultra Manager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sukisu-manager.yml'

permissions:
  contents: read

jobs:
  build-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ddddd and SukiSU Ultra source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ddddd-release.jks"
          chmod 600 "$RUNNER_TEMP/ddddd-release.jks"

      - name: Set manager version
        working-directory: vendor/SukiSU-Ultra/manager
        run: |
          echo "Building SukiSU Ultra Manager 9.9.9 beta"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build.gradle.kts")
          s = p.read_text(encoding="utf-8")
          old = 'fun getVersionName(): String {\n    return getGitDescribe()\n}'
          new = 'fun getVersionName(): String {\n    return "9.9.9 beta"\n}'
          if old not in s:
              raise SystemExit("Cannot find upstream manager version function; refusing an unsafe edit")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Build SukiSU Ultra Manager APK
        working-directory: vendor/SukiSU-Ultra/manager
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: ${{ runner.temp }}/ddddd-release.jks
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug -PIS_PR_BUILD=false

      - name: Upload SukiSU Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-ultra-manager-debug
          path: vendor/SukiSU-Ultra/manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
