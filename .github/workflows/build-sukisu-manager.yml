name: Build SukiSU Ultra Manager

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-sukisu-manager.yml'

permissions:
  contents: read

jobs:
  build-manager:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Ddddd repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out official SukiSU Ultra source
        uses: actions/checkout@v4
        with:
          repository: SukiSU-Ultra/SukiSU-Ultra
          ref: main
          path: SukiSU-Ultra
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Missing KEYSTORE_BASE64 secret."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ddddd-release.jks"
          chmod 600 "$RUNNER_TEMP/ddddd-release.jks"

      - name: Build SukiSU Ultra Manager APK
        working-directory: SukiSU-Ultra/manager
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: ${{ runner.temp }}/ddddd-release.jks
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug -PIS_PR_BUILD=false

      - name: Upload SukiSU Manager APK
        uses: actions/upload-artifact@v4
        with:
          name: sukisu-ultra-manager-debug
          path: SukiSU-Ultra/manager/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
